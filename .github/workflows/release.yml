name: Release

# 打 tag 即发布。GitHub 会为每个 Release 自动附上 Source code (zip) 与 Source code (tar.gz)，
# 因此这里**不构建、不打包、不上传任何附件**——本插件经源码分发，Release 的作用是
# 「给 tag 一份可读的说明 + 一个稳定的源码下载入口」。
#
# 幂等策略：同一个 tag 已有 Release 时**覆盖更新**（标题与正文），没有则新建。
# 这样重跑工作流、或 tag 被强制移动后重新发布，都不会留下过期的说明。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（如 v0.9.1；留空则用最近一个 tag）
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # 同一个 tag 同时只跑一个 Release 工作流，避免建/改撞车。
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 发布前先跑完整 CI，绿灯才允许出 Release。
  # 复用 ci.yml 的 workflow_call，避免两处矩阵各写一遍、日后漂移。
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: create or update GitHub release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve release tag
        id: vars
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          # 手动触发且没给 tag 时，退到最近一个 v* tag，方便补发。
          if [ -z "$TAG" ] || [ "$TAG" = "master" ] || [ "$TAG" = "main" ]; then
            TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            echo "未指定 tag，回退到最近的 tag: ${TAG:-<无>}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::仓库里没有任何 v* tag，无法发布"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "已确定 tag: $TAG"

      # tag 与 package.json 版本必须一致，否则用户看到 v0.2.0 的 Release
      # 却装到 0.1.0 的代码——这类偏差不会有任何东西自动报错。
      - name: Assert tag matches package.json version
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.vars.outputs.version }}"
          echo "package.json: $PKG / tag: $TAG_VERSION"
          if [ "$PKG" != "$TAG_VERSION" ]; then
            echo "::error::tag ${{ steps.vars.outputs.tag }} 与 package.json 版本 $PKG 不一致，先改版本号再打 tag"
            exit 1
          fi

      - name: Assert tag exists in repository
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/${{ steps.vars.outputs.tag }}" >/dev/null
          echo "tag 指向提交: $(git rev-list -n1 "${{ steps.vars.outputs.tag }}")"

      # 正文优先级：CHANGELOG 对应小节 > 自动生成的变更列表 > 提交清单兜底。
      # 注意 gh release edit 不支持 --generate-notes，所以「自动生成」这条路径
      # 必须先取到文本再作为 --notes-file 传进去，不能直接转发参数。
      - name: Compose release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${TAG#v}"
          NOTES=/tmp/release-notes.md

          if [ -f CHANGELOG.md ] && grep -q "^## ${VERSION}" CHANGELOG.md; then
            awk -v ver="$VERSION" '
              index($0, "## " ver) == 1 { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md > "$NOTES"
            echo "正文来源: CHANGELOG.md"
          else
            # 直接调 GitHub 的生成说明 API 取文本。
            # 为什么不用 `gh release create --generate-notes`：那会真的建一个 Release，
            # 而 `gh release edit` 又不支持 --generate-notes，无法在覆盖路径上复用。
            if gh api "repos/${{ github.repository }}/releases/generate-notes" \
                 -f tag_name="$TAG" --jq .body > "$NOTES" 2>/dev/null && [ -s "$NOTES" ]; then
              echo "正文来源: GitHub 自动生成"
            else
              : > "$NOTES"
            fi

            # 首个版本没有上一个 tag 可比时，自动生成只剩一行 "Full Changelog"，
            # 正文会空得没法读。这种情况补一份提交清单。
            BODY_LINES=$(grep -cve '^[[:space:]]*$' "$NOTES" || true)
            if [ "$BODY_LINES" -lt 3 ]; then
              echo "自动生成内容过少，补充提交清单"
              {
                printf '## 本版提交\n\n'
                PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)
                if [ -n "$PREV" ]; then
                  git log --no-merges --pretty='- %s (%h)' "${PREV}..${TAG}"
                else
                  git log --no-merges --pretty='- %s (%h)' "$TAG" | head -n 30
                fi
                printf '\n**完整变更**：%s/commits/%s\n' \
                  "${{ github.server_url }}/${{ github.repository }}" "$TAG"
              } > "${NOTES}.new"
              mv "${NOTES}.new" "$NOTES"
            fi
          fi

          echo "--- 正文预览 ---"
          cat "$NOTES"
          echo "file=$NOTES" >> "$GITHUB_OUTPUT"

      # 幂等：已存在就覆盖标题与正文，不存在就新建。
      # --verify-tag 两侧都带：tag 必须已存在于远端，防止 gh 悄悄新建一个
      # 指向当前 HEAD 的 tag——那可能不是要发布的那次提交。
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          NOTES="${{ steps.notes.outputs.file }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖标题与正文"
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --verify-tag
            ACTION=updated
          else
            echo "Release $TAG 不存在，新建"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --verify-tag
            ACTION=created
          fi

          echo "### Release $TAG ${ACTION} ✅" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json name,tagName,isDraft,isPrerelease,url,assets \
            | tee /tmp/release.json
          {
            echo '```json'
            cat /tmp/release.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
