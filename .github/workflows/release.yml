name: Release

# 全自动发布：CI 跑完 → 读 package.json 版本号 → tag 不存在就自动建 → Release 有则覆盖、无则新建。
#
# 主人只需要「改版本号 + push」，Release 自己会出来，不用手动打 tag。
#
# 为什么用 workflow_run 而不是 push 直接触发：
#   ci.yml 已经监听 push master 了。若本工作流也监听 push master，同一个提交会
#   触发两条链路、CI 跑两遍。workflow_run 让本工作流在 CI 结束后才启动，
#   既不重复跑测试，也天然满足「CI 绿了才允许发布」。
#
# GitHub 会为每个 Release 自动附上 Source code (zip) 与 Source code (tar.gz)，
# 因此这里**不构建、不打包、不上传任何附件**——本插件经源码分发，Release 的作用是
# 「给 tag 一份可读的说明 + 一个稳定的源码下载入口」。
#
# 幂等策略：同一个版本已有 Release 时**覆盖更新**（标题与正文），没有则新建。
# 这样重跑工作流、或同一个版本被再次推送，都不会留下过期的说明。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: 要发布的提交（分支/标签/SHA；留空则用当前提交）。补发历史版本时填
        required: false
        type: string
      tag:
        description: 强制指定 tag（留空则用 package.json 版本自动推导）
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # 同一个提交同时只跑一个发布，避免建/改撞车。
  # 用 sha 而非分支名分组：分支名会把不同提交误并成同一组而互相排队。
  group: release-${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: create or update GitHub release
    # CI 成功才发布；手动触发是主人的明确意图，不再校验 CI 结论。
    # workflow_run 也会被「CI 失败」的事件唤起，故需显式过滤，否则失败提交也会发版。
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 要发布的那个提交。workflow_run 下 github.sha 是默认分支 HEAD，
      # 不是触发 CI 的那个提交，必须显式取 head_sha。
      TARGET_REF: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          # 取全量历史：生成发布说明时要按提交算 diff、找上一个 tag。
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 版本号是唯一事实来源：tag 从 package.json 推导，不再靠人记得去打。
      # 之前用 tag 触发，改完版本号忘了打 tag 就永远发不出来——这是实际踩过的坑。
      #
      # ⚠️ 必须读「目标提交那次」的 package.json，而不是工作区里 checkout 到的。
      # 补发历史版本时 TARGET_REF 是旧提交，但工作区可能停在更新的 HEAD 上；
      # 读错版本会把 v0.9.2 补发成 v0.9.4。这里用 git show 精确定位。
      - name: Resolve version from package.json
        id: vars
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse "${TARGET_REF}^{commit}")

          # 直接从目标提交的 git 对象里取版本，与工作区状态无关。
          VERSION=$(git show "${TARGET_SHA}:package.json" | node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              try { console.log(JSON.parse(s).version || ""); }
              catch (e) { console.log(""); }
            });
          ')
          if [ -z "$VERSION" ]; then
            echo "::error::目标提交 $TARGET_SHA 的 package.json 里读不到 version 字段"
            exit 1
          fi

          TAG="v${VERSION}"
          # 手动触发可强制指定 tag（补发例外情况用）。
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            echo "手动指定 tag: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "目标提交 $TARGET_SHA 的版本: $VERSION -> tag: $TAG"

      # tag 不存在时由工作流补建，打在要发布的那个提交上。
      # 不能用「当前远端 HEAD」——时序上不确定它是不是刚通过 CI 的那份代码。
      - name: Ensure tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          TARGET_SHA=$(git rev-parse "${TARGET_REF}^{commit}")
          echo "目标提交: $TARGET_SHA"

          git fetch --tags --force --quiet origin || true
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag $TAG 已存在，无需创建"
            exit 0
          fi

          echo "创建并推送 tag $TAG -> $TARGET_SHA"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$TARGET_SHA"
          git push origin "refs/tags/${TAG}"

      # tag 与目标提交的 package.json 版本必须一致，否则用户看到 v0.2.0 的 Release
      # 却装到 0.1.0 的代码——这类偏差不会有任何东西自动报错。
      - name: Assert tag matches package.json version
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse "${TARGET_REF}^{commit}")
          PKG=$(git show "${TARGET_SHA}:package.json" | node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              try { console.log(JSON.parse(s).version || ""); }
              catch (e) { console.log(""); }
            });
          ')
          TAG_VERSION="${{ steps.vars.outputs.version }}"
          echo "目标提交 package.json: $PKG / tag: $TAG_VERSION"
          if [ "$PKG" != "$TAG_VERSION" ]; then
            echo "::error::tag ${{ steps.vars.outputs.tag }} 与目标提交的 package.json 版本 $PKG 不一致"
            exit 1
          fi

      - name: Assert tag exists in repository
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          git fetch --tags --force --quiet origin || true
          git rev-parse --verify "refs/tags/${TAG}" >/dev/null
          echo "tag 指向提交: $(git rev-list -n1 "$TAG")"

      # 正文优先级：CHANGELOG 对应小节 > 自动生成的变更列表 > 提交清单兜底。
      # 注意 gh release edit 不支持 --generate-notes，所以「自动生成」这条路径
      # 必须先取到文本再作为 --notes-file 传进去，不能直接转发参数。
      - name: Compose release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${TAG#v}"
          NOTES=/tmp/release-notes.md
          # 每个 step 是独立 shell，上一步的 TARGET_SHA 不会继承下来，这里重取。
          TARGET_SHA=$(git rev-parse "${TARGET_REF}^{commit}")

          if [ -f CHANGELOG.md ] && grep -q "^## ${VERSION}" CHANGELOG.md; then
            awk -v ver="$VERSION" '
              index($0, "## " ver) == 1 { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md > "$NOTES"
            echo "正文来源: CHANGELOG.md"
          else
            # 直接调 GitHub 的生成说明 API 取文本。
            # 为什么不用 `gh release create --generate-notes`：那会真的建一个 Release，
            # 而 `gh release edit` 又不支持 --generate-notes，无法在覆盖路径上复用。
            if gh api "repos/${{ github.repository }}/releases/generate-notes" \
                 -f tag_name="$TAG" --jq .body > "$NOTES" 2>/dev/null && [ -s "$NOTES" ]; then
              echo "正文来源: GitHub 自动生成"
            else
              : > "$NOTES"
            fi

            # 首个版本没有上一个 tag 可比时，自动生成只剩一行 "Full Changelog"，
            # 正文会空得没法读。这种情况补一份提交清单。
            #
            # ⚠️ 这里用 --max-count 而不是 `| head -n N`。
            # `set -o pipefail` 下，head 读够就关闭管道，git 端收到 SIGPIPE
            # 退出 141，pipefail 会把这个 141 当成整条命令失败——提交少的仓库
            # 恰好躲得过（输出一次写完），提交多的仓库必炸。--max-count 让 git
            # 自己限制输出条数，不产生管道截断。
            BODY_LINES=$(grep -cve '^[[:space:]]*$' "$NOTES" || true)
            if [ "$BODY_LINES" -lt 3 ]; then
              echo "自动生成内容过少，补充提交清单"
              {
                printf '## 本版提交\n\n'
                # ⚠️ 必须用 --merged 限定「目标提交的祖先 tag」。
                # 只按版本号降序取第一个非自身的 tag 会拿到**未来版本**：
                # 补发 v0.9.2 时仓库里已有 v0.9.4，区间会算成 v0.9.4..v0.9.2，
                # 方向反了，git log 直接报错或被解释成奇怪的范围。
                PREV=$(git tag --list 'v*' --merged "$TARGET_SHA" --sort=-v:refname \
                       | awk -v t="$TAG" '$0 != t { print; exit }')
                if [ -n "$PREV" ]; then
                  echo "区间: ${PREV}..${TARGET_SHA}"
                  git log --no-merges --max-count=50 --pretty='- %s (%h)' "${PREV}..${TARGET_SHA}"
                else
                  echo "无上一个 tag，列出到目标提交的全部提交"
                  git log --no-merges --max-count=50 --pretty='- %s (%h)' "$TARGET_SHA"
                fi
                printf '\n**完整变更**：%s/commits/%s\n' \
                  "${{ github.server_url }}/${{ github.repository }}" "$TAG"
              } > "${NOTES}.new"
              mv "${NOTES}.new" "$NOTES"
            fi
          fi

          echo "--- 正文预览 ---"
          cat "$NOTES"
          echo "file=$NOTES" >> "$GITHUB_OUTPUT"

      # 幂等：已存在就覆盖标题与正文，不存在就新建。
      # --verify-tag 两侧都带：tag 必须已存在于远端，防止 gh 悄悄新建一个
      # 指向当前 HEAD 的 tag——那可能不是要发布的那次提交。
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          NOTES="${{ steps.notes.outputs.file }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖标题与正文"
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --verify-tag
            ACTION=updated
          else
            echo "Release $TAG 不存在，新建"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --verify-tag
            ACTION=created
          fi

          echo "### Release $TAG ${ACTION} ✅" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json name,tagName,isDraft,isPrerelease,url,assets \
            | tee /tmp/release.json
          {
            echo '```json'
            cat /tmp/release.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
